- title: giCentre at EuroVis
  date: 2024-06-10
  imgs:
    - news/dany-eurovis.jpeg
  preview: >
    Dany presented his short paper on gridded-glyphmaps for multi-criteria decision support at EuroVis 2024 in Odense.
  content: |
    [Dany](https://www.city.ac.uk/about/people/research-students/dany-laksono) presented his short paper at EuroVis
    2024 in Odense, Denmark. The work - supervised by
    [Radu](https://www.city.ac.uk/about/people/academics/radu-jianu) and
    [Aidan](https://www.city.ac.uk/about/people/academics/aidan-slingsby) and part-funded by AITL - focuses on the use
    of gridded-glyphmaps for showing multivariate geospatial data used for multi-criteria decision-support.
    [See the paper here.](https://diglib.eg.org/items/e40356dc-dcf2-4a82-8be9-b1e271619dde)

- title: Hello Mai!
  date: 2023-04-17
  imgs:
    - news/mai-elshehaly.jpg
    - news/mai-elshehaly-cmv.jpg
  preview: >
    We welcome Mai Elshehaly as a Lecturer in Visualisation at the giCentre.
  content: |
    We welcome [Mai Elshehaly](http://invisai.com/mai/) as a Lecturer in Visualisation at the giCentre.

    Mai designs, develops and evaluates visual analytics for population health management with a particular interest
    in the role of routine data and digital footprints in decision-making.

    An Honorary Senior Research Fellow at the Wolfson Centre for Applied Health Research, Mai leads the visualisation
    stream at the Yorkshire and Humber Patient Safety Research Centre. She works closely with colleagues at local
    authorities and several partner organisations to deliver data literacy to over 30,000 young citizens in Bradford.

    Mai received a PhD in Computer Science from the Center for Human-Computer Interaction at Virginia Tech, with a
    focus on scientific data visualisation. Her postdoctoral research experience included NSF- and NIHR-funded
    fellowships at the University of Maryland, Baltimore County and University of Leeds.

    Check [Mai’s publications](https://dblp.dagstuhl.de/pid/47/7861.html) to find out more about her exciting work in
    visualization and public health.
